name: MCPShield Verification

on:
  push:
    branches: [main, mcp/main, master/main, feature/frontend-gateway-devops]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install monorepo dependencies
        run: |
          node scripts/ops/normalize-lock.mjs --check
          npm ci
      - name: Test backend, contracts, gateway, and replay demo
        run: npm test
      - name: Build backend types and dashboard
        run: npm run build
      - name: Validate compose
        if: matrix.node == 22
        run: |
          docker compose config --quiet
          docker compose -f docker-compose.yml -f compose.observability.yml config --quiet
      - name: Exercise actual Linux sandbox isolation
        if: matrix.node == 22
        timeout-minutes: 5
        env:
          MCPSHIELD_DOCKER_TESTS: "1"
        run: |
          docker pull node:22-alpine
          node --test tests/security/docker-sandbox.test.mjs
      - name: Validate actual collector and alert configuration
        if: matrix.node == 22
        run: |
          docker run --rm -v "$PWD/deploy/observability/collector.yaml:/etc/otelcol/config.yaml:ro" otel/opentelemetry-collector-contrib:0.160.0 validate --config=/etc/otelcol/config.yaml
          docker run --rm --entrypoint /bin/promtool -v "$PWD/deploy/observability:/etc/prometheus:ro" prom/prometheus:v3.14.0 check rules /etc/prometheus/alerts.yaml
      - name: Run Docker Compose end-to-end
        if: matrix.node == 22
        timeout-minutes: 10
        run: |
          docker compose up --build --wait
          node -e "fetch('http://127.0.0.1:3000/api/live').then(r=>r.json()).then(x=>{if(x.source!=='LIVE'||x.ledgerMode!=='EVM'||x.admissions?.length!==2||!x.admissions.every(a=>a.decision==='BLOCK'&&a.source==='LIVE'&&a.spawnAttempted===false))process.exit(1)})"
      - name: Stop Docker Compose
        if: always() && matrix.node == 22
        run: docker compose down --volumes --remove-orphans
      - name: Audit production dependencies
        if: matrix.node == 22
        run: npm audit --omit=dev --audit-level=high
      - name: Scan every tracked file for secrets
        if: matrix.node == 22
        run: |
          findings="$(git grep -nEIi -f .github/secret-scan-patterns.regex -- . ':!package-lock.json' ':!.github/secret-scan-patterns.regex' ':!.github/secret-scan-allowlist.regex' || true)"
          unexpected="$(printf '%s\n' "$findings" | grep -Evf .github/secret-scan-allowlist.regex || true)"
          if [ -n "$unexpected" ]; then
            printf '%s\n' "$unexpected"
            exit 1
          fi

name: Frontend Gateway DevOps

on:
  push:
    branches: [main, feature/frontend-gateway-devops]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            apps/dashboard/package-lock.json
            apps/gateway/package-lock.json
      - name: Test gateway
        run: npm ci --prefix apps/gateway && npm test --prefix apps/gateway
      - name: Build dashboard
        run: npm ci --prefix apps/dashboard && npm run build --prefix apps/dashboard
      - name: Run replay smoke test
        run: npm run demo:reset --prefix scripts/demo && npm run demo:run --prefix scripts/demo
      - name: Validate compose
        run: docker compose config --quiet
      - name: Reject obvious private keys
        run: |
          if grep -RIE --exclude='*.lock' --exclude-dir=node_modules 'BEGIN (RSA|OPENSSH|EC) PRIVATE KEY|AKIA[0-9A-Z]{16}' apps/dashboard apps/gateway scripts/demo; then
            exit 1
          fi

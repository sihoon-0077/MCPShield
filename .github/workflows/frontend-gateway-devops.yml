name: Frontend Gateway DevOps

on:
  push:
    branches: [main, feature/frontend-gateway-devops]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install monorepo dependencies
        run: npm ci
      - name: Test backend, contracts, gateway, and replay demo
        run: npm test
      - name: Build backend types and dashboard
        run: npm run build
      - name: Validate compose
        run: docker compose config --quiet
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Reject obvious private keys
        run: |
          if grep -RIE --exclude='*.lock' --exclude-dir=node_modules --exclude-dir=test --exclude-dir=tests 'BEGIN (RSA|OPENSSH|EC) PRIVATE KEY|AKIA[0-9A-Z]{16}' apps contracts packages services scripts; then
            exit 1
          fi

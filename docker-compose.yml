name: mcpshield

# This stack contains synthetic data and deterministic DEVELOPMENT credentials only.
# Bindings are loopback-only. Supply non-default secrets through the environment for any shared host.
x-security: &security
  read_only: true
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

x-backend-env: &backend-env
  ADMIN_API_TOKEN: ${ADMIN_API_TOKEN:-dev_admin_token_32_characters}
  SCANNER_API_TOKEN: ${SCANNER_API_TOKEN:-dev_scanner_token_32_characters}
  CORS_ALLOWLIST: http://localhost:3000
  DATABASE_PATH: /data/mcpshield.db
  API_HOST: 0.0.0.0
  API_PORT: 3001
  MCPSHIELD_JUDGE_DEMO_ENABLED: "true"
  VALIDATOR_ADDRESSES: 0x70997970C51812dc3A010C7d01b50e0d17dc79C8,0x3C44CdDdB6a900fa2b585dd299e03d12FA4293BC,0x90F79bf6EB2c4f870365E785982E1f101E93b906
  ATTESTATION_CHAIN_ID: 31337
  RPC_URL: http://local-chain:8545
  RELAYER_PRIVATE_KEY: "0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80"

x-gateway-env: &gateway-env
  MCPSHIELD_MODE: live
  MCPSHIELD_API_URL: http://backend:3001
  MCPSHIELD_ADMISSION_TIMEOUT_MS: 3000
  MCPSHIELD_GATEWAY_ENTRYPOINT: /app/apps/gateway/src/index.mjs
  MCPSHIELD_PROBE_ARTIFACT: /fixtures/mail-mcp-1.0.1

x-gateway: &gateway
  <<: *security
  build:
    context: .
    dockerfile: apps/gateway/Dockerfile
  command: ["sh", "-c", "node /app/gateway-probe.mjs && exec node /app/apps/gateway/src/index.mjs serve"]
  environment: *gateway-env
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=32m,mode=1777
  depends_on:
    demo-seed:
      condition: service_completed_successfully
  healthcheck:
    test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
    interval: 5s
    timeout: 2s
    retries: 12
  restart: unless-stopped

services:
  local-chain:
    <<: *security
    build:
      context: .
      dockerfile: scripts/demo/Dockerfile.backend
    command: ["npx", "ganache", "--server.host", "0.0.0.0", "--server.port", "8545", "--chain.chainId", "31337", "--wallet.mnemonic", "test test test test test test test test test test test junk", "--logging.quiet"]
    ports:
      - "127.0.0.1:8545:8545"
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m,mode=1777
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8545',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({jsonrpc:'2.0',id:1,method:'eth_chainId',params:[]})}).then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  contract-init:
    <<: *security
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    user: "0:0"
    build:
      context: .
      dockerfile: scripts/demo/Dockerfile.backend
    command: ["sh", "-c", "chown node:node /deployment /data /evidence-a /evidence-b && exec su node -s /bin/sh -c 'chmod 0750 /deployment /data /evidence-a /evidence-b && umask 027 && npm run chain:deploy'"]
    environment:
      RPC_URL: http://local-chain:8545
      DEPLOYER_PRIVATE_KEY: "0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80"
      VALIDATOR_ADDRESSES: 0x70997970C51812dc3A010C7d01b50e0d17dc79C8,0x3C44CdDdB6a900fa2b585dd299e03d12FA4293BC,0x90F79bf6EB2c4f870365E785982E1f101E93b906
      DEPLOYMENT_ENV_PATH: /deployment/registry.env
    volumes:
      - deployment:/deployment
      - projection:/data
      - gateway-evidence-a:/evidence-a
      - gateway-evidence-b:/evidence-b
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m,mode=1777
    depends_on:
      local-chain:
        condition: service_healthy
    restart: "no"

  backend:
    <<: *security
    build:
      context: .
      dockerfile: scripts/demo/Dockerfile.backend
    environment: *backend-env
    command: ["sh", "-c", "set -a && . /deployment/registry.env && set +a && exec npm run start:api"]
    ports:
      - "127.0.0.1:3001:3001"
    volumes:
      - deployment:/deployment:ro
      - projection:/data
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,mode=1777
    depends_on:
      contract-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health').then(r=>r.json()).then(x=>{if(x.ledgerMode!=='EVM')process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  indexer:
    <<: *security
    build:
      context: .
      dockerfile: scripts/demo/Dockerfile.backend
    command: ["sh", "-c", "set -a && . /deployment/registry.env && set +a && exec npm run start:indexer"]
    environment:
      RPC_URL: http://local-chain:8545
      DATABASE_PATH: /data/mcpshield.db
      CONFIRMATION_DEPTH: 0
      POLL_INTERVAL_MS: 1000
      INDEXER_HEALTH_PATH: /tmp/indexer-health
    volumes:
      - deployment:/deployment:ro
      - projection:/data
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=8m,mode=1777
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "test -s /tmp/indexer-health"]
      interval: 5s
      timeout: 2s
      retries: 20
    restart: unless-stopped

  demo-seed:
    <<: *security
    build:
      context: .
      dockerfile: scripts/demo/Dockerfile.backend
    command: ["sh", "-c", "set -a && . /deployment/registry.env && set +a && npm run demo:seed"]
    environment:
      <<: *backend-env
      MCPSHIELD_API_URL: http://backend:3001
    volumes:
      - deployment:/deployment:ro
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m,mode=1777
    depends_on:
      indexer:
        condition: service_healthy
    restart: "no"

  dashboard:
    <<: *security
    build:
      context: .
      dockerfile: apps/dashboard/Dockerfile
    environment:
      MCPSHIELD_API_URL: http://backend:3001
      MCPSHIELD_API_TIMEOUT_MS: 3000
      MCPSHIELD_GATEWAY_EVIDENCE_DIR: /evidence
    ports:
      - "127.0.0.1:3000:3000"
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m,mode=1777
      - /app/apps/dashboard/.next/cache:rw,noexec,nosuid,size=32m,mode=1777
    volumes:
      - gateway-evidence-a:/evidence/gateway-a:ro
      - gateway-evidence-b:/evidence/gateway-b:ro
    depends_on:
      demo-seed:
        condition: service_completed_successfully
      gateway-a:
        condition: service_healthy
      gateway-b:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  gateway-a:
    <<: *gateway
    environment:
      <<: *gateway-env
      MCPSHIELD_GATEWAY_NAME: Gateway A LIVE probe
      MCPSHIELD_GATEWAY_EVIDENCE_FILE: /evidence/gateway-a.json
    volumes:
      - gateway-evidence-a:/evidence
    ports:
      - "127.0.0.1:8787:8787"

  gateway-b:
    <<: *gateway
    environment:
      <<: *gateway-env
      MCPSHIELD_GATEWAY_NAME: Gateway B LIVE probe
      MCPSHIELD_GATEWAY_EVIDENCE_FILE: /evidence/gateway-b.json
    volumes:
      - gateway-evidence-b:/evidence
    ports:
      - "127.0.0.1:8788:8787"

  scanner:
    <<: *security
    profiles: ["scan"]
    build:
      context: .
      dockerfile: scripts/demo/Dockerfile.scanner
    command: ["node", "services/scanner/src/cli.mjs", "--fixture", "demo/fixtures/mail-mcp-1.0.1", "--baseline", "demo/fixtures/mail-mcp-1.0.0", "--sandbox", "local", "--submit-url", "http://backend:3001/api/scans"]
    environment:
      SCANNER_API_TOKEN: ${SCANNER_API_TOKEN:-dev_scanner_token_32_characters}
    depends_on:
      demo-seed:
        condition: service_completed_successfully
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,mode=1777
    restart: "no"

  exfil-sink:
    <<: *security
    profiles: ["standalone-sink"]
    build:
      context: .
      dockerfile: scripts/demo/Dockerfile.scanner
    command: ["node", "services/exfil-sink/server.mjs"]
    environment:
      HOST: 0.0.0.0
      PORT: 8080
      SINK_TOKEN: ${SINK_TOKEN:-dev_sink_token_32_characters}
    expose:
      - "8080"
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m,mode=1777
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 2s
      retries: 12
    restart: unless-stopped

volumes:
  deployment:
  projection:
  gateway-evidence-a:
  gateway-evidence-b:
